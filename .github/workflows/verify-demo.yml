name: Verificar demo municipal
on:
  push:
    branches: [demo-comercial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Revisar código y compilar
        run: npm run check && npm run build
      - name: Preparar navegador de verificación
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Comprobar recorridos y diseño adaptable
        run: |
          node scripts/serve.mjs &
          node scripts/verify-demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion-demo-municipal
          path: test-results/
